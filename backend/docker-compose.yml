# Compose stack for local prod-like testing.
# Use the same image DO App Platform will build.
services:
  api:
    build: .
    image: kaameasy-backend:latest
    container_name: kaameasy-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env                          # non-secret vars
    environment:
      # Secret — read from the host env, not from the file.
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
