<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Browser tab title + theme + iOS / PWA metadata -->
    <title>KaamEasy Provider</title>
    <meta name="description" content="KaamEasy Provider — accept jobs, negotiate with customers, and track your earnings in real time." />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="KaamEasy Provider" />
    <meta name="apple-mobile-web-app-title" content="KaamEasy Provider" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / Twitter (uses the new name) -->
    <meta property="og:title" content="KaamEasy Provider" />
    <meta property="og:description" content="KaamEasy Provider — accept jobs, negotiate with customers, and track your earnings in real time." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="KaamEasy Provider" />
    <meta name="twitter:description" content="KaamEasy Provider — accept jobs, negotiate with customers, and track your earnings in real time." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      /* Prevent the white flash before Expo Router hydrates. */
      html, body { background-color: #1a1a1a; color: #ffffff; margin: 0; }
    </style>
  </head>
  <body>
    <!-- Root mount point used by Expo Router on web -->
    <div id="root"></div>
  </body>
</html>
